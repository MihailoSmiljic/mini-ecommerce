services:

  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo
    networks:
      - ecommerce-net

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    networks:
      - ecommerce-net

  users-service:
    build: ./users-service
    container_name: users-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
    depends_on:
      - config-server
      - eureka-server
    networks:
      - ecommerce-net

  products-service:
    build: ./products-service
    container_name: products-service
    ports:
      - "8082:8082"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
    depends_on:
      - config-server
      - eureka-server
    networks:
      - ecommerce-net

  orders-service:
    build: ./orders-service
    container_name: orders-service
    ports:
      - "8083:8083"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
    depends_on:
      - config-server
      - eureka-server
      - users-service
      - products-service
    networks:
      - ecommerce-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
    depends_on:
      - config-server
      - eureka-server
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge