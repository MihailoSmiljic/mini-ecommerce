server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: users-service-route
              uri: lb://USERS-SERVICE
              predicates:
                - Path=/api/users/**

            - id: products-service-route
              uri: lb://PRODUCTS-SERVICE
              predicates:
                - Path=/api/products/**

            - id: orders-service-route
              uri: lb://ORDERS-SERVICE
              predicates:
                - Path=/api/orders/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      access: read_only